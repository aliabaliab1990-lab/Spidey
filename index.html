<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>مغامرة سبايدي الصغيرة</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">
    <meta name="apple-mobile-web-app-title" content="سبايدي">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            inset: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #38BDF8 0%, #7DD3FC 68%, #4ADE80 68%, #22C55E 100%);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #scoreBoard {
            position: absolute;
            top: max(18px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            background: #FACC15;
            border: 5px solid #EF4444;
            border-radius: 40px;
            padding: 8px 26px;
            font-size: 34px;
            font-weight: 900;
            color: #1E293B;
            box-shadow: 0 6px 0 #DC2626, 0 10px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            z-index: 5;
        }

        #startOverlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 24px;
        }

        h1 {
            color: #EF4444;
            font-size: clamp(34px, 7vw, 56px);
            margin-bottom: 32px;
            text-shadow: 3px 3px 0px #FACC15;
            line-height: 1.3;
        }

        #startBtn {
            background: linear-gradient(180deg, #F87171 0%, #EF4444 100%);
            color: #FFFFFF;
            border: 6px solid #FACC15;
            border-radius: 50px;
            padding: 24px 52px;
            font-size: clamp(30px, 6vw, 44px);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 0 #B91C1C, 0 16px 28px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            animation: pulse 1.8s infinite;
        }

        #startBtn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #B91C1C;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
    </style>
</head>
<body>

    <div id="scoreBoard">⭐ <span id="score">0</span></div>

    <div id="startOverlay">
        <h1>🕷️ هيا نلعب مع سبايدي! 🕸️</h1>
        <button id="startBtn">اضغط للبدء ▶️</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');

        let width = 0;
        let height = 0;
        let score = 0;
        let targets = [];
        let webs = [];
        let particles = [];
        let clouds = [];
        let audioCtx = null;
        let isGameRunning = false;

        const spidey = {
            x: 0,
            y: 0,
            bounce: 0,
            shooting: false,
            shootSide: 1
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            spidey.x = width / 2;
            spidey.y = height - 115;
        }
        window.addEventListener('resize', resize);
        resize();

        function unlockAudio() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
            } catch (e) {
                console.warn('Audio unlock skipped:', e);
            }
        }

        function playWebSound() {
            try {
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1280, audioCtx.currentTime + 0.14);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.14);
            } catch (e) {
                console.warn('Web sound skipped:', e);
            }
        }

        function playPopSound() {
            try {
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(360, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(950, audioCtx.currentTime + 0.22);
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.22);
            } catch (e) {
                console.warn('Pop sound skipped:', e);
            }
        }

        function initClouds() {
            clouds = [];
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: 45 + Math.random() * (height * 0.24),
                    speed: 0.25 + Math.random() * 0.35,
                    size: 36 + Math.random() * 24
                });
            }
        }
        initClouds();

        const targetStyles = [
            { color: '#EF4444', emoji: '🎈' },
            { color: '#F59E0B', emoji: '⭐' },
            { color: '#22C55E', emoji: '🍏' },
            { color: '#3B82F6', emoji: '⚽' },
            { color: '#EC4899', emoji: '🍩' },
            { color: '#EAB308', emoji: '🐥' }
        ];

        function spawnTarget() {
            if (targets.length >= 4) return;
            const style = targetStyles[Math.floor(Math.random() * targetStyles.length)];
            const radius = Math.min(60, Math.max(46, width * 0.09));
            const margin = radius + 24;

            targets.push({
                x: margin + Math.random() * Math.max(40, width - margin * 2),
                y: margin + 55 + Math.random() * Math.max(40, (height * 0.48) - margin),
                radius: radius,
                color: style.color,
                emoji: style.emoji,
                vx: (Math.random() - 0.5) * 1.1,
                vy: (Math.random() - 0.5) * 1.1,
                scale: 0,
                wobble: Math.random() * Math.PI * 2
            });
        }

        function drawSpidey(x, y) {
            ctx.save();
            const bounceOffset = Math.sin(spidey.bounce) * 5;
            ctx.translate(x, y + bounceOffset);

            ctx.fillStyle = '#2563EB';
            ctx.beginPath();
            ctx.roundRect(-24, 60, 19, 36, 9);
            ctx.roundRect(5, 60, 19, 36, 9);
            ctx.fill();

            ctx.fillStyle = '#EF4444';
            ctx.beginPath();
            ctx.roundRect(-26, 80, 23, 22, 11);
            ctx.roundRect(3, 80, 23, 22, 11);
            ctx.fill();

            ctx.fillStyle = '#2563EB';
            ctx.beginPath();
            ctx.roundRect(-32, 8, 64, 64, 24);
            ctx.fill();

            ctx.fillStyle = '#EF4444';
            ctx.beginPath();
            ctx.roundRect(-21, 8, 42, 50, 16);
            ctx.fill();

            ctx.fillStyle = '#0F172A';
            ctx.beginPath();
            ctx.arc(0, 31, 7.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#0F172A';
            ctx.beginPath();
            ctx.moveTo(-13, 25); ctx.lineTo(13, 37);
            ctx.moveTo(-13, 37); ctx.lineTo(13, 25);
            ctx.moveTo(-15, 31); ctx.lineTo(15, 31);
            ctx.stroke();

            ctx.strokeStyle = '#EF4444';
            ctx.lineWidth = 15;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(-28, 20);
            if (spidey.shooting && spidey.shootSide === -1) {
                ctx.lineTo(-55, -20);
            } else {
                ctx.lineTo(-48, 44);
                ctx.lineTo(-30, 54);
            }
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(28, 20);
            if (spidey.shooting && spidey.shootSide === 1) {
                ctx.lineTo(55, -20);
            } else {
                ctx.lineTo(48, 44);
                ctx.lineTo(30, 54);
            }
            ctx.stroke();

            ctx.fillStyle = '#EF4444';
            ctx.beginPath();
            ctx.ellipse(0, -40, 52, 58, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = '#B91C1C';
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0, 0, 0, 0.22)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -98); ctx.lineTo(0, 18);
            ctx.moveTo(-52, -40); ctx.lineTo(52, -40);
            ctx.moveTo(-36, -80); ctx.lineTo(36, 0);
            ctx.moveTo(36, -80); ctx.lineTo(-36, 0);
            ctx.stroke();

            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#0F172A';
            ctx.lineWidth = 7;
            ctx.beginPath();
            ctx.ellipse(-22, -40, 18, 26, -0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(22, -40, 18, 26, 0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        function createCelebration(x, y, color) {
            for (let i = 0; i < 22; i++) {
                const angle = (Math.PI * 2 / 22) * i;
                const speed = 3 + Math.random() * 6;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: i % 2 === 0 ? color : '#FACC15',
                    size: 9 + Math.random() * 9,
                    life: 1
                });
            }
        }

        function handleTap(clientX, clientY) {
            if (!isGameRunning) return;

            let hitTarget = null;
            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                const dist = Math.hypot(clientX - t.x, clientY - t.y);
                if (dist <= t.radius + 55) {
                    hitTarget = t;
                    targets.splice(i, 1);
                    break;
                }
            }

            const targetX = hitTarget ? hitTarget.x : clientX;
            const targetY = hitTarget ? hitTarget.y : clientY;

            spidey.shootSide = targetX < spidey.x ? -1 : 1;
            spidey.shooting = true;
            setTimeout(() => { spidey.shooting = false; }, 260);
            playWebSound();

            const handX = spidey.x + (spidey.shootSide * 42);
            const handY = spidey.y - 14;

            webs.push({
                startX: handX,
                startY: handY,
                endX: targetX,
                endY: targetY,
                progress: 0,
                life: 1
            });

            if (hitTarget) {
                setTimeout(() => {
                    playPopSound();
                    createCelebration(hitTarget.x, hitTarget.y, hitTarget.color);
                    score++;
                    scoreEl.textContent = score;
                }, 90);
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleTap(e.clientX, e.clientY);
        });

        function startGame(e) {
            if (e) e.preventDefault();
            if (isGameRunning) return;
            unlockAudio();
            startOverlay.style.display = 'none';
            isGameRunning = true;
            for (let i = 0; i < 3; i++) spawnTarget();
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('pointerdown', startGame);
        startBtn.addEventListener('click', startGame);

        function loop() {
            if (!isGameRunning) return;

            ctx.clearRect(0, 0, width, height);
            spidey.bounce += 0.05;

            ctx.save();
            ctx.fillStyle = '#FACC15';
            ctx.beginPath();
            ctx.arc(70, 75, 42, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 7;
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.45)';
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            clouds.forEach(c => {
                c.x += c.speed;
                if (c.x - c.size * 2 > width) c.x = -c.size * 2;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.75, c.y - 10, c.size * 0.8, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 1.45, c.y, c.size * 0.85, 0, Math.PI * 2);
                ctx.fill();
            });

            if (Math.random() < 0.035) spawnTarget();

            targets.forEach(t => {
                if (t.scale < 1) t.scale = Math.min(1, t.scale + 0.06);
                t.wobble += 0.04;
                t.x += t.vx;
                t.y += t.vy + Math.sin(t.wobble) * 0.4;

                const boundMargin = t.radius + 15;
                if (t.x < boundMargin) { t.x = boundMargin; t.vx *= -1; }
                if (t.x > width - boundMargin) { t.x = width - boundMargin; t.vx *= -1; }
                if (t.y < boundMargin + 50) { t.y = boundMargin + 50; t.vy *= -1; }
                if (t.y > height * 0.54) { t.y = height * 0.54; t.vy *= -1; }

                ctx.save();
                ctx.translate(t.x, t.y);
                ctx.scale(t.scale, t.scale);

                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.arc(0, 0, t.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 6;
                ctx.strokeStyle = '#FFFFFF';
                ctx.stroke();

                ctx.font = `${Math.floor(t.radius * 1.05)}px -apple-system, Apple Color Emoji, Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t.emoji, 0, 4);
                ctx.restore();
            });

            for (let i = webs.length - 1; i >= 0; i--) {
                const w = webs[i];
                if (w.progress < 1) {
                    w.progress = Math.min(1, w.progress + 0.25);
                } else {
                    w.life -= 0.05;
                }

                const curX = w.startX + (w.endX - w.startX) * w.progress;
                const curY = w.startY + (w.endY - w.startY) * w.progress;

                ctx.save();
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, w.life)})`;
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(w.startX, w.startY);
                ctx.lineTo(curX, curY);
                ctx.stroke();

                if (w.progress >= 1) {
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(w.endX, w.endY, 26, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();

                if (w.life <= 0) webs.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.12;
                p.life -= 0.028;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.life <= 0) particles.splice(i, 1);
            }

            drawSpidey(spidey.x, spidey.y);

            requestAnimationFrame(loop);
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
